<title>Data Academy Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Night grid with one ember accent. Three views: choose a track, walk the 20 steps, check progress and quiz. */
:root{
  --bg:#09090A; --bg-2:#0F0F11; --surface:#131316; --raise:#1A1A1E; --line:#232328; --line-2:#2E2E35;
  --ink:#F2F1EE; --ink-2:#B9B7B2; --muted:#7D7B77; --accent:#FF7A2F; --accent-2:#FFA266; --accent-ink:#140A04;
  --accent-soft:rgba(255,122,47,.12); --good:#5BD18B; --good-soft:rgba(91,209,139,.12); --grid:rgba(255,255,255,.035);
  --sans:"Geist","Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0;min-height:100%;
  background-image:radial-gradient(900px 420px at 78% -120px,rgba(255,122,47,.16),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,64px 64px,64px 64px;background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.kicker{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker b{color:var(--accent);font-weight:500}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;backdrop-filter:blur(12px);background:rgba(9,9,10,.72);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.logo i{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font:700 12px var(--sans);font-style:normal}
.tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--bg-2)}
.tabs button{border:0;background:none;color:var(--muted);font:500 13.5px var(--sans);padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--raise);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
@media (max-width:560px){.logo span{display:none}.tabs button{padding:6px 10px;font-size:13px}}

main{padding-block:56px 96px}
section+section{margin-top:72px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);font:500 13.5px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:default}

/* view 1 */
.hero h1{font-size:clamp(38px,6.4vw,68px);line-height:1.02;margin:16px 0 18px;max-width:14ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{color:var(--ink-2);font-size:17px;max-width:56ch}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:44px;border-top:1px solid var(--line)}
.flow div{padding:18px 18px 0 0;display:flex;flex-direction:column;gap:6px;position:relative;min-width:0}
.flow div::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.flow div:first-child::before{background:var(--accent)}
.flow b{font-weight:600}
.flow span{color:var(--muted);font-size:13.5px}
@media (max-width:720px){.flow{grid-template-columns:1fr 1fr;row-gap:20px}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:24px}
.sec-h p{color:var(--muted);font-size:14px}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.tracks{grid-template-columns:1fr}}
.track{border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--bg-2));border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.track:hover{border-color:var(--line-2);transform:translateY(-1px)}
.track[aria-pressed="true"]{border-color:var(--accent)}
.track .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.track h3{font-size:21px}
.track p{color:var(--ink-2);font-size:14px}
.track .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex:none;width:100%}
.track .foot .bar{flex:1;width:auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.chip{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}
.chip.hot{color:var(--accent);border-color:rgba(255,122,47,.4)}
.stack{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg-2)}
.stack-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.layer{padding:16px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.layer:last-child{border-right:0}
.layer .kicker{font-size:11px}
.layer b{font-weight:600;font-size:14px}
.layer span{font-size:12.5px;color:var(--muted)}
.layer.me{background:var(--accent-soft)}
.layer.me .kicker{color:var(--accent)}
.stack-foot{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.stack-foot b{color:var(--ink-2);font-weight:500}
@media (max-width:820px){.stack-row{grid-template-columns:repeat(2,minmax(0,1fr))}.layer{border-bottom:1px solid var(--line)}.layer:nth-child(2n){border-right:0}}
.callout{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:16px;padding:18px 20px}
.callout p{color:var(--ink-2);font-size:14px;max-width:62ch}
.callout b{color:var(--ink)}
a{color:var(--accent-2);text-underline-offset:3px}

/* view 2 */
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
@media (max-width:720px){.head{grid-template-columns:1fr}}
.head h1{font-size:clamp(32px,5vw,52px);line-height:1.05;margin-top:12px}
.head p{color:var(--ink-2);margin-top:12px;max-width:60ch}
.meter{display:flex;flex-direction:column;gap:10px;min-width:240px}
.meter .num{font:500 13px var(--mono);color:var(--muted);display:flex;justify-content:space-between}
.meter .num b{color:var(--ink);font-weight:500}
.steps{margin-top:40px;border-top:1px solid var(--line)}
.stage-lbl{display:flex;justify-content:space-between;align-items:center;padding:28px 0 10px}
.step{border-bottom:1px solid var(--line)}
.step > button{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;background:none;border:0;cursor:pointer;text-align:left}
.step .n{font:500 14px var(--mono);color:var(--muted)}
.step .t{font-weight:500;font-size:15.5px}
.step .t small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.state{font:500 11.5px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.doing{color:var(--accent);border-color:rgba(255,122,47,.4)}
.state.done{color:var(--good);border-color:rgba(91,209,139,.35)}
.step.done .t{color:var(--ink-2)}
.step.done .n{color:var(--good)}
.step.next .n{color:var(--accent)}
.detail{padding:4px 0 26px 62px;display:flex;flex-direction:column;gap:18px}
@media (max-width:640px){.detail{padding-left:0}.step > button{grid-template-columns:36px minmax(0,1fr) auto}}
.detail .goal{color:var(--ink-2);max-width:66ch}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.do{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:820px){.do{grid-template-columns:1fr}}
.do > div{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg-2);min-width:0}
.do .kicker{font-size:11px}
.do p{font-size:13.5px;color:var(--ink-2)}
.do code{font:12.5px var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:block;overflow-x:auto;white-space:pre;color:var(--ink)}
.do .btn{align-self:flex-start}
.do .row{margin-top:auto}
.do a.btn{text-decoration:none;color:var(--ink)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-2)}
.how li::marker{color:var(--accent);font-family:var(--mono)}
.detail .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.more{margin-top:40px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border:1px solid var(--line);border-radius:16px;padding:20px;background:var(--bg-2)}
.more p{color:var(--ink-2);font-size:14px;max-width:60ch}
.note{font-size:13px;color:var(--muted)}

/* view 3 */
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}
@media (max-width:820px){.areas{grid-template-columns:1fr}}
.area{border:1px solid var(--line);border-radius:16px;padding:20px;background:linear-gradient(180deg,var(--surface),var(--bg-2));display:flex;flex-direction:column;gap:14px;min-width:0}
.area .big{font:500 44px/1 var(--sans);letter-spacing:-.03em}
.area .big small{font-size:16px;color:var(--muted);letter-spacing:0}
.area ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.area li{display:flex;gap:8px;color:var(--ink-2)}
.area li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:8px;background:var(--line-2)}
.area li.ok{color:var(--ink)}
.area li.ok::before{background:var(--good)}
.score{font:500 12.5px var(--mono);color:var(--muted)}
.quiz{margin-top:16px;border:1px solid var(--line-2);border-radius:16px;padding:22px;background:var(--surface);display:flex;flex-direction:column;gap:16px}
.quiz h3{font-size:19px;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;border:1px solid var(--line-2);background:var(--bg-2);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:14.5px}
.opts button:hover:not(:disabled){border-color:var(--ink-2)}
.opts button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong{border-color:var(--accent);background:var(--accent-soft)}
.why{color:var(--ink-2);font-size:14px}
.log{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.entry{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.entry .d{font:500 12.5px var(--mono);color:var(--muted)}
.entry p{color:var(--ink-2);font-size:14px;margin-top:2px}
@media (max-width:560px){.entry{grid-template-columns:1fr;gap:4px}}
.empty{border:1px dashed var(--line-2);border-radius:14px;padding:20px;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tabs{overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.nav-r{display:flex;align-items:center;gap:10px}
.lang{border:1px solid var(--line);background:var(--bg-2);border-radius:999px;font:500 12px var(--mono);padding:5px 9px;cursor:pointer;color:var(--ink-2)}
@media (max-width:700px){.logo span{display:none}.tabs button{padding:6px 9px;font-size:12.5px}}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:14px;color:var(--ink-2);font-size:15.5px}
.prose b{color:var(--ink);font-weight:600}
.me{display:grid;grid-template-columns:72px minmax(0,1fr);gap:20px;align-items:start;border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(180deg,var(--surface),var(--bg-2))}
.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 26px var(--sans);border:1px solid rgba(255,122,47,.35)}
@media (max-width:560px){.me{grid-template-columns:1fr}}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:820px){.pillars{grid-template-columns:1fr}}
.pillar{border-top:1px solid var(--line-2);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.pillar b{font-weight:600}
.pillar p{color:var(--muted);font-size:14px}
.guide{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.g-step{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:22px 0;border-bottom:1px solid var(--line)}
.g-step .n{font:500 14px var(--mono);color:var(--accent);padding-top:3px}
.g-step h3{font-size:17px;margin-bottom:6px}
.g-step p{color:var(--ink-2);font-size:14.5px;max-width:70ch}
.g-step code{display:block;margin-top:10px;font:12.5px var(--mono);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre;color:var(--ink)}
.g-step .row{margin-top:10px}
</style>

<nav><div class="wrap nav">
  <div class="logo"><i>DA</i><span>Data Academy</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="nav-r"><button class="lang" id="lang" aria-label="Language"></button><span class="dot" id="dot"></span></div>
</div></nav>

<main class="wrap">
  <div id="v-tracks"></div>
  <div id="v-track" hidden></div>
  <div id="v-progress" hidden></div>
  <div id="v-guide" hidden></div>
  <div id="v-about" hidden></div>
</main>

async function startQuiz(key, label, done){

  if (busy) return; busy = true;
  state.quiz = {key, label, loading:true, i:0, score:0, picked:null, items:[]}; render();
  try {
    const prompt = 'Write a 5-question multiple-choice quiz for a student on the ' + ROLES[state.focus].en[0] + ' track who has just finished these hands-on labs: ' + topics.join(' | ') + '. Test understanding and application, not trivia; use the stack GA4, dlt, Fivetran, Snowflake or BigQuery, dbt, Dagster, Looker Studio, Git where relevant.' + inSv() + ' Return only JSON: an array of 5 objects with keys q (the question), options (array of 4 short strings), answer (index 0-3 of the correct option), why (one sentence explaining the correct answer).';

        i === 3 ? el('div',{class:'row'}, el('button',{class:'btn primary',textContent:t.tabs[0] + ' →',onclick:() => go('tracks')})) : null));
  })));
}

/* ---------- about ---------- */
function viewAbout(){
  const t = T(), v = $('#v-about'); v.replaceChildren();
  const bio = state.bio[state.lang] || state.bio.en || state.bio.sv;
  v.append(el('section',{class:'head',style:'grid-template-columns:1fr'}, el('div',{}, el('div',{class:'kicker',html:'<b>' + t.aboutK + '</b>'}), el('h1',{textContent:t.aboutH}))));
  if (bio) v.append(el('section',{style:'margin-top:36px'}, el('div',{class:'me'}, el('div',{class:'avatar',textContent:(state.name || '?').slice(0,1).toUpperCase()}), el('div',{class:'prose'}, el('span',{class:'kicker',textContent:t.meK}), el('b',{textContent:state.name,style:'font-size:20px'}), ...String(bio).split(/\n\n+/).map(x => el('p',{textContent:x}))))));
  v.append(el('section',{}, el('div',{class:'prose'}, el('p',{textContent:t.aboutP}))));
  v.append(el('section',{style:'margin-top:40px'}, el('div',{class:'pillars'}, t.pillars.map(([a,b]) => el('div',{class:'pillar'}, el('b',{textContent:a}), el('p',{textContent:b}))))));
  v.append(el('section',{}, el('div',{class:'callout'}, el('p',{html:'<b>' + t.creatorK + ':</b> ' + t.creatorP}), el('a',{class:'btn',href:REPO,target:'_blank',rel:'noopener',textContent:t.repoB}))));
}

function render(){
  const t = T();
  document.documentElement.lang = state.lang;
  $('#tabs').replaceChildren(...VIEWS.map((x, i) => el('button',{textContent:t.tabs[i],'aria-current':x === state.view ? 'page' : null,onclick:() => go(x)})));
  $('#lang').textContent = state.lang === 'en' ? 'SV' : 'EN';
  VIEWS.forEach(x => { $('#v-' + x).hidden = x !== state.view; });
  ({tracks:viewTracks, track:viewTrack, progress:viewProgress, guide:viewGuide, about:viewAbout})[state.view]();
}
$('#lang').addEventListener('click', () => setLang(state.lang === 'en' ? 'sv' : 'en'));
const h = location.hash.slice(1); if (VIEWS.includes(h)) state.view = h;
render();

(async () => {
  if (!window.claude?.use) return;
  const [d, u, s] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('sample')]);
  db = d; sample = s;
  if (!db) { render(); return; }
  state.canWrite = u ? (u.can('data.write') !== false) : true;
  $('#dot').classList.add('on');
  let first = true;
  db.doc('hub/profile').onSnapshot(snap => { const p = snap.data() || {}; if (p.focus && ROLES[p.focus]) state.focus = p.focus; if (p.lang === 'sv' || p.lang === 'en') state.lang = p.lang; state.name = p.name || ''; state.bio = {en:p.bio_en || '', sv:p.bio_sv || ''}; if (first && p.focus && !h) state.view = 'track'; first = false; render(); }, () => {});
  db.collection('progress').onSnapshot(snap => { state.progress = {}; snap.docs.forEach(x => { state.progress[x.id] = x.data()?.status || 'todo'; }); render(); }, () => {});
  db.collection('log').orderBy('date','desc').limit(50).onSnapshot(snap => { state.log = snap.docs.map(x => x.data() || {}); render(); }, () => {});
  db.collection('extraLabs').orderBy('createdAt','asc').onSnapshot(snap => { state.extra = snap.docs.map(x => ({id:x.id, ...(x.data() || {})})); render(); }, () => {});
  db.collection('quizzes').onSnapshot(snap => { state.quizzes = snap.docs.map(x => x.data() || {}); render(); }, () => {});
})();
</script>
