<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Claude Data Academy: 30 skills from source to decision">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#262A31"/></pattern>
    <linearGradient id="flow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3A3F48"/><stop offset="0.45" stop-color="#F26B1D"/><stop offset="0.75" stop-color="#FF9A5C"/><stop offset="1" stop-color="#3A3F48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F26B1D" stop-opacity="0.45"/><stop offset="1" stop-color="#F26B1D" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="0.75" cy="0.2" r="0.9"><stop offset="0" stop-color="#1E2127"/><stop offset="1" stop-color="#0F1114"/></radialGradient>
  </defs>
  <rect width="1280" height="520" fill="url(#vignette)"/>
  <rect width="1280" height="520" fill="url(#dots)"/>

  <!-- headline -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="62" width="282" height="34" rx="17" fill="#1F232A" stroke="#3A3F48"/>
    <circle cx="94" cy="79" r="5" fill="#F26B1D"/>
    <text x="108" y="85" font-size="15" font-weight="700" letter-spacing="2.5" fill="#E6E7EA">CLAUDE DATA ACADEMY</text>
    <text x="72" y="160" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Make your AI a</text>
    <text x="72" y="226" font-size="58" font-weight="800" fill="#F26B1D" letter-spacing="-1">data mentor.</text>
    <text x="72" y="270" font-size="20" fill="#AEB3BB">Diagnose, teach step by step, build, and make you prove it.</text>
  </g>

  <!-- stat card -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="850" y="62" width="358" height="190" rx="20" fill="#181B20" stroke="#2E333B"/>
    <text x="880" y="110" font-size="14" font-weight="700" letter-spacing="2" fill="#8A8F98">CLAUDE SKILLS</text>
    <text x="880" y="196" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-3">30</text>
    <text x="1030" y="160" font-size="16" fill="#AEB3BB">data engineer</text>
    <text x="1030" y="184" font-size="16" fill="#AEB3BB">analytics engineer</text>
    <text x="1030" y="208" font-size="16" fill="#AEB3BB">data analyst</text>
    <rect x="880" y="222" width="298" height="4" rx="2" fill="#2E333B"/>
    <rect x="880" y="222" width="200" height="4" rx="2" fill="#F26B1D"/>
  </g>

  <!-- pipeline -->
  <path d="M110 410 C 260 350, 330 470, 470 410 S 690 350, 810 410 S 1030 470, 1170 410" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="640" cy="380" r="120" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">
    <g><circle cx="110" cy="410" r="14" fill="#16181C" stroke="#5A606A" stroke-width="3"/><text x="110" y="458" fill="#8A8F98">SOURCES</text></g>
    <g><circle cx="290" cy="396" r="14" fill="#16181C" stroke="#5A606A" stroke-width="3"/><text x="290" y="452" fill="#8A8F98">INGEST</text></g>
    <g><circle cx="470" cy="410" r="14" fill="#16181C" stroke="#8A8F98" stroke-width="3"/><text x="470" y="458" fill="#AEB3BB">STORE</text></g>
    <g><circle cx="640" cy="378" r="22" fill="#F26B1D"/><circle cx="640" cy="378" r="8" fill="#FFFFFF"/><text x="640" y="428" fill="#FFFFFF">TRANSFORM</text></g>
    <g><circle cx="810" cy="410" r="14" fill="#16181C" stroke="#FF9A5C" stroke-width="3"/><text x="810" y="458" fill="#AEB3BB">SERVE</text></g>
    <g><circle cx="990" cy="444" r="14" fill="#16181C" stroke="#5A606A" stroke-width="3"/><text x="990" y="490" fill="#8A8F98">ANALYSE</text></g>
    <g><circle cx="1170" cy="410" r="14" fill="#16181C" stroke="#5A606A" stroke-width="3"/><text x="1170" y="458" fill="#8A8F98">DECIDE</text></g>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A606A" text-anchor="middle">
    <text x="290" y="476">Fivetran · dlt</text><text x="470" y="476">Snowflake</text><text x="640" y="446">dbt</text><text x="810" y="476">metrics · BI</text><text x="990" y="507">stats · ML</text><text x="1170" y="476">business</text><text x="110" y="476">GA4 · CRM</text>
  </g>
</svg>
